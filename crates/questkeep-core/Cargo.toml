[package]
name = "questkeep-core"
description = "Core library of the Questkeep game launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
questkeep-imaging = { path = "../questkeep-imaging" }
questkeep-store-api = { path = "../questkeep-store-api" }
questkeep-system = { path = "../questkeep-system" }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
# Watches the folders installed games are in (installs done in the store clients).
notify = "9.0.0"
# Text filters: regular expressions, matched in a custom SQL function; the version is the one
# already locked.
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled", "chrono", "functions", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings", "chrono-impl", "uuid-impl"] }
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
# Backup archives; the version is the one already locked.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
# Executable icons (USER32 + GDI) and process checks (Wdk_System_Threading and
# Win32_System_Diagnostics_Debug: a process's working directory); the version is the one already
# locked.
windows-sys = { version = "0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Shortcuts (.lnk files through IShellLinkW); the version is the one already locked (Tauri).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
questkeep-store-api = { path = "../questkeep-store-api", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
